<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.11 - Tablas HTML</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- table sirve para crear una tabla con filas y columnas. -->
<table>

    <!-- caption sirve para poner un título a la tabla. -->
    <caption>Horario de 1º DAW</caption>

    <!-- tr sirve para crear una fila de la tabla. -->
    <tr>
        <!-- th sirve para crear una celda de encabezado. -->
        <th>Hora</th>
        <th>Lunes</th>
        <th>Martes</th>
        <th>Miércoles</th>
        <th>Jueves</th>
        <th>Viernes</th>
    </tr>
        <tr>
        <th>15:30 - 16:25</th>
    </tr>

    <tr>
        <th>16:25 - 17:20</th>
    </tr>

    <tr>
        <th>17:20 - 18:15</th>
    </tr>

    <tr>
        <th>18:15 - 18:35</th>
    </tr>

    <tr>
        <th>18:35 - 19:30</th>
    </tr>

    <tr>
        <th>19:30 - 20:25</th>
    </tr>

    <tr>
        <th>20:25 - 21:15</th>
    </tr>

    <tr>
        <th>21:15 - 22:05</th>
    </tr>
</table>
</body>
</html>
