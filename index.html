<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.11 - Tablas HTML</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- table sirve para crear una tabla con filas y columnas. -->
<table>

    <!-- caption sirve para poner un título a la tabla. -->
    <caption>Horario de 1º DAW</caption>

    <!-- tr sirve para crear una fila de la tabla. -->
    <tr>
        <!-- th sirve para crear una celda de encabezado. -->
        <th>Hora</th>
        <th>Lunes</th>
        <th>Martes</th>
        <th>Miércoles</th>
        <th>Jueves</th>
        <th>Viernes</th>
    </tr>

</table>
</body>
</html>
